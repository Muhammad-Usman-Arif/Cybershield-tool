{% extends 'base.html' %}
{% block title %}404 — Page Not Found{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div style="font-family:'Rajdhani',sans-serif;font-size:6rem;color:var(--accent);line-height:1">404</div>
  <h3 class="text-muted mt-2">Page Not Found</h3>
  <p class="text-muted mb-4">The page you're looking for doesn't exist or has been moved.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-cyber">
    <i class="fas fa-home me-2"></i>Back to Dashboard
  </a>
</div>
{% endblock %}
